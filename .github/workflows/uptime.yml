name: Uptime check

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  health:
    name: Health check producción
    runs-on: ubuntu-latest
    steps:
      - name: Check /health/ready
        id: check
        run: |
          set -o pipefail
          BODY=$(curl -fsS -m 15 https://api.tiendamagica.shop/health/ready) || {
            echo "body=unreachable" >> "$GITHUB_OUTPUT"
            exit 1
          }
          echo "body=$BODY" >> "$GITHUB_OUTPUT"
          echo "$BODY" | grep -q '"status":"ok"' || exit 1

      - name: Abrir issue si está caído
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const body = `🔴 **Producción degradada** — ${new Date().toISOString()}

            \`GET https://api.tiendamagica.shop/health/ready\` falló o reportó estado no-ok.

            Respuesta: \`${{ steps.check.outputs.body || 'sin respuesta' }}\`

            [Ver run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: "uptime",
              state: "open",
            });
            if (open.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: "🔴 Uptime: api.tiendamagica.shop caído",
                body,
                labels: ["uptime"],
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.data[0].number,
                body,
              });
            }
